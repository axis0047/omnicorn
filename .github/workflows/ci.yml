name: CI

on:
  push:
    branches: [dev/stable, release/stable]
  pull_request:
    branches: [dev/stable, release/stable]

env:
  PYTHON_VERSION: "3.11"
  ERLANG_VERSION: "26"

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Black format check
        run: black --check omnicorn/ tests/
      
      - name: Ruff lint
        run: ruff check omnicorn/ tests/
      
      - name: mypy type check
        run: mypy omnicorn/

  lint-erlang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
          rebar3-version: "3"
      
      - name: Build Erlang
        run: |
          cd omnicorn/erl_src
          rebar3 compile
      
      - name: Format check
        run: |
          cd omnicorn/erl_src
          rebar3 fmt --check
      
      - name: Lint
        run: |
          cd omnicorn/erl_src
          rebar3 lint

  test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-erlang]
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        erlang-version: ["25", "26", "27"]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.erlang-version }}
          rebar3-version: "3"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Build Erlang
        run: ./scripts/build.sh
      
      - name: Install Python dev dependencies
        run: pip install -e ".[dev]"
      
      - name: Run Python tests
        run: pytest tests/ -v --cov=omnicorn --cov-report=xml
      
      - name: Run Erlang tests
        run: |
          cd omnicorn/erl_src
          rebar3 eunit
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_VERSION }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Build
        run: ./scripts/build.sh
      
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      
      - name: Run integration tests
        run: pytest tests/test_integration.py -v
