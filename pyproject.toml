[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicorn"
version = "2.0.0"
description = "Erlang/OTP Distributed Application Server & Temporal Alternative"
readme = "README.md"
requires-python = ">=3.8"
dependencies =[
    "click",
    "pyyaml",
    "erlpack"
]

[project.scripts]
omnicorn = "omnicorn.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnicorn*"]
